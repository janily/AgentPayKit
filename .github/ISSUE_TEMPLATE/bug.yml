name: Bug report
description: Report a reproducible non-payment defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include secrets, wallet URIs, payment signatures, or private keys.
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include commands, expected behavior, actual behavior, and sanitized output.
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [Base Sepolia, Not payment related]
    validations:
      required: true
